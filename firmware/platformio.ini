[env:ttgo-t-beam]
# Heltec LoRa 32 (capteur autonome)
[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = ttgo-t-beam
framework = arduino

; Vitesse du moniteur série (à faire correspondre dans le code)
monitor_speed = 115200

; Téléchargement automatique des bibliothèques
lib_deps =
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    mikalhart/TinyGPSPlus @ ^1.0.3

#  LILYGO T-Beam LORA32 — TEST UNITAIRE
[env:lilygo_tbeam_test]
platform = espressif32@6.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200

build_src_filter = -<*> +<../tests/lilygo_tbeam/>

lib_deps =
    jgromes/RadioLib
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    mikalhart/TinyGPSPlus
    lewishe/XPowersLib

# ─── Capteur poussière GP2Y1010AU0F (Waveshare) sur T-Beam — TEST UNITAIRE ───
[env:capteur_poussiere_test]
platform = espressif32@6.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200

build_src_filter = -<*> +<../tests/capteur_poussiere/>

# ─── LoRa T-Beam V1.2 (SX1276) — Émetteur TEST ───────────────────────────────
[env:lora_tbeam_sender_test]
platform = espressif32@6.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM6
monitor_port = COM6

build_src_filter = -<*> +<../tests/lora_tbeam_sender/>

lib_deps =
    jgromes/RadioLib
    https://github.com/lewisxhe/XPowersLib.git
    mikalhart/TinyGPSPlus

# ─── LoRa Heltec WiFi LoRa 32 V3 (SX1262) — Récepteur TEST ──────────────────
[env:lora_heltec_receiver_test]
platform = espressif32@6.5.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
upload_port = COM11
monitor_port = COM11

build_src_filter = -<*> +<../tests/lora_heltec_receiver/>

lib_deps =
    jgromes/RadioLib