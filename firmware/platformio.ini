# Les credentials WiFi et l'IP de l'API sont dans platformio.local.ini (non commité).
# Copier platformio.local.ini.example → platformio.local.ini et remplir les valeurs.
[platformio]
extra_configs = platformio.local.ini

# ─── Firmware principal T-Beam (capteur autonome complet) ────────────────────
[env:tbeam_main]
platform = espressif32@6.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = hwgrep://CH9102
monitor_port = hwgrep://CH9102
build_src_filter = +<*> -<gateway_heltec/>

lib_deps =
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    mikalhart/TinyGPSPlus @ ^1.0.3
    jgromes/RadioLib
    https://github.com/lewisxhe/XPowersLib.git


# ─── LoRa T-Beam V1.2 (SX1276) — Émetteur TEST ───────────────────────────────
[env:lora_tbeam_sender_test]
platform = espressif32@6.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = hwgrep://CH9102
monitor_port = hwgrep://CH9102
build_src_filter = -<*> +<../tests/lora_tbeam_sender/>

lib_deps =
    jgromes/RadioLib
    https://github.com/lewisxhe/XPowersLib.git
    mikalhart/TinyGPSPlus

# ─── LoRa Heltec WiFi LoRa 32 V3 (SX1262) — Récepteur TEST ──────────────────
[env:lora_heltec_receiver_test]
platform = espressif32@6.5.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
upload_port = hwgrep://CP210x
monitor_port = hwgrep://CP210x
build_src_filter = -<*> +<../tests/lora_heltec_receiver/>

lib_deps =
    jgromes/RadioLib

# ─── Gateway Heltec WiFi LoRa 32 V3 (SX1262) → WiFi → API ───────────────────
# WiFi et IP lus depuis les variables d'environnement système (set une seule fois
# par PC, voir README ou platformio.local.ini.example pour la commande PowerShell).
[env:heltec_gateway]
platform = espressif32@6.5.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
upload_port = hwgrep://CP210x
monitor_port = hwgrep://CP210x
build_src_filter = -<*> +<gateway_heltec/>

lib_deps =
    jgromes/RadioLib
    bblanchon/ArduinoJson @ ^7
